services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PI_FIREWALL_BACKEND: mock
      PI_FIREWALL_DB: /data/firewall.sqlite3
    volumes:
      - firewall_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

volumes:
  firewall_data:
